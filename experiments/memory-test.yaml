apiVersion: v1
kind: Pod
metadata:
  name: memory-test
  namespace: kubernetes-learning
spec:
  restartPolicy: Never
  containers:
    - name: memory-test
      image: python:3.12-alpine
      command:
        - python
        - -c
        - "x = bytearray(100 * 1024 * 1024); import time; time.sleep(300)"
      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi"
