apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
  namespace: kubernetes-learning
spec:
  containers:
    - name: storage-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo 'Hello from Kubernetes Persistent Storage!' > /data/test.txt && sleep 3600"
      volumeMounts:
        - name: app-storage
          mountPath: /data
  volumes:
    - name: app-storage
      persistentVolumeClaim:
        claimName: app-storage-pvc
