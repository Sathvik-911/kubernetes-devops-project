apiVersion: batch/v1
kind: Job
metadata:
  name: storage-writer
  namespace: kubernetes-learning
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "Written at $(date) by pod $HOSTNAME" >> /data/test.txt && cat /data/test.txt
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: app-storage
              mountPath: /data
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage-pvc
