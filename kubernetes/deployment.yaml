apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: kubernetes-learning
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: web-app-config
            - secretRef:
                name: web-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: health-check
              mountPath: /usr/share/nginx/html/readyz
              subPath: readyz
              readOnly: true

      volumes:
        - name: health-check
          configMap:
            name: web-app-health
