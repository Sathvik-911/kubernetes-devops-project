apiVersion: apps/v1
kind: Deployment
metadata:
  name: visit-counter
  namespace: kubernetes-learning
  labels:
    app: visit-counter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: visit-counter
  template:
    metadata:
      labels:
        app: visit-counter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: visit-counter
          image: sathvik627/visit-counter:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: visit-counter-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: visit-counter-secret
                  key: REDIS_PASSWORD
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: visit-counter
  namespace: kubernetes-learning
spec:
  type: NodePort
  selector:
    app: visit-counter
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30082
